name: JurisQuest Server Answer Security Patch

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  patch-server-answers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Apply server-authoritative answer patch
        run: python scripts/apply_server_answer_security.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game-runtime-pro-v4.tsx app/game/'[id]'/page.tsx app/plantao/page.tsx
          git commit -m "security: keep answer keys out of gameplay clients"
          git push origin HEAD:jurisquest-commercial-20260916
