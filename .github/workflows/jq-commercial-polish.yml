name: JurisQuest Commercial Polish

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Apply commercial product polish
        run: python scripts/polish_commercial.py
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/page.tsx app/page.tsx app/actions.ts components/product-navigation.tsx app/profile/page.tsx app/review/page.tsx app/archive/page.tsx components/game-runtime-pro-v4.tsx qa/user-flow.spec.mjs
          git commit -m "feat: commercial polish and daily-return guidance"
          git push origin HEAD:jurisquest-commercial-20260916
