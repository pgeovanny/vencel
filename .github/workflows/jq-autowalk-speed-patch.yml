name: JurisQuest Autowalk Speed Patch

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  patch-autowalk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Apply autowalk + QA timing patch
        run: python scripts/patch_autowalk_speed_and_qa.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game-runtime-pro-v4.tsx qa/user-flow.spec.mjs
          git commit -m "perf: speed up target navigation and harden journey timing"
          git push origin HEAD:jurisquest-commercial-20260916
