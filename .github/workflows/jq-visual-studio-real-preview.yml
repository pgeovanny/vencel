name: JurisQuest Visual Studio Real Preview

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  patch-visual-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Apply real-preview patch
        run: python scripts/apply_visual_studio_real_preview.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/admin/visual-studio.tsx
          git commit -m "feat: show real game assets in Visual Studio previews"
          git push origin HEAD:jurisquest-commercial-20260916
