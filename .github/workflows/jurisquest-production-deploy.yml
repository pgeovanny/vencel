name: JurisQuest Production Deploy
on:
  push:
    branches: [jurisquest-next]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_uDhFWiDQ6N65FSbGCFH1KF9S
      VERCEL_PROJECT_ID: prj_LeCuaE0l0bUBTpyKA3oFj6WDVMJ0
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment credential
        run: test -n "$VERCEL_TOKEN"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - name: Link project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Deploy production
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
