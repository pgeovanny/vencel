name: JurisQuest Production Deploy
on:
  push:
    branches: [jurisquest-next]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_uDhFWiDQ6N65FSbGCFH1KF9S
      VERCEL_PROJECT_ID: prj_LeCuaE0l0bUBTpyKA3oFj6WDVMJ0
      VERCEL_SCOPE: geovanny8-6963s-projects
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment credential
        run: test -n "$VERCEL_TOKEN"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@59.20.0
      - name: Deploy production
        run: |
          rm -rf .vercel
          vercel deploy --prod --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
