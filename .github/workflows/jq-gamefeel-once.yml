name: JurisQuest Game Feel Polish
on:
  push:
    branches: [jurisquest-commercial-20260916]
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - run: python scripts/polish_game_feel.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game-runtime-pro-v4.tsx qa/user-flow.spec.mjs
          git commit -m "feat: tighten movement pacing for study sessions"
          git push origin HEAD:jurisquest-commercial-20260916
