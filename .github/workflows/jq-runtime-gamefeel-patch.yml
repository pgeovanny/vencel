name: JurisQuest Runtime Game Feel Patch

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  patch-gamefeel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Apply runtime game-feel patch
        run: python scripts/apply_runtime_gamefeel.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game-runtime-pro-v4.tsx lib/game/studio-css.ts
          git commit -m "feat: add movement and interaction game feel"
          git push origin HEAD:jurisquest-commercial-20260916
