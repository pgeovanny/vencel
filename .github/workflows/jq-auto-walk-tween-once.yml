name: JurisQuest Timed Auto Walk Patch
on:
  push:
    branches: [jurisquest-commercial-20260916]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - run: python scripts/fix_auto_walk_tween.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game-runtime-pro-v4.tsx
          git commit -m "fix: make automatic movement frame-rate independent"
          git push origin HEAD:jurisquest-commercial-20260916
