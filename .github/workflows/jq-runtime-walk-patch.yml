name: JurisQuest Runtime Walk Patch

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  patch-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Make auto-walk distance aware
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/game-runtime-pro-v4.tsx')
          s=p.read_text()
          marker='jqDistanceAwareWalk'
          if marker in s:
              print('Distance-aware walk already applied')
              raise SystemExit(0)
          old="""    startAuto(type:'actor'|'object',id:string,go:any){if(!this.canClick(type,id))return;this.autoTarget={type,id,go};this.autoOpenLock=false;setCloud(`Indo até ${type==='actor'?'o personagem':'a evidência'}…`)}"""
          new="""    startAuto(type:'actor'|'object',id:string,go:any){if(!this.canClick(type,id))return;const d=Math.hypot(go.x-this.player.x,go.y-this.player.y);const speed=Math.max(90,Math.min(155,d/7));this.autoTarget={type,id,go,speed,jqDistanceAwareWalk:true};this.autoOpenLock=false;setCloud(`Indo até ${type==='actor'?'o personagem':'a evidência'}…`)}"""
          oldvel="""this.player.body.setVelocity(dx/d*WALK_SPEED,dy/d*WALK_SPEED);"""
          newvel="""this.player.body.setVelocity(dx/d*(t.speed||WALK_SPEED),dy/d*(t.speed||WALK_SPEED));"""
          if old not in s or oldvel not in s:
              raise SystemExit('Expected walk snippets not found; refusing unsafe patch')
          s=s.replace(old,new,1).replace(oldvel,newvel,1)
          p.write_text(s)
          print('Applied distance-aware auto-walk')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game-runtime-pro-v4.tsx
          git commit -m "fix: make click-to-walk speed distance aware"
          git push origin HEAD:jurisquest-commercial-20260916
