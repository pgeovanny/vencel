name: JurisQuest Runtime External Assets Patch

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  patch-runtime-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Apply runtime asset overrides
        run: python scripts/patch_runtime_external_assets.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game-runtime-pro-v4.tsx app/game/'[id]'/page.tsx app/plantao/page.tsx
          git commit -m "feat: support admin-managed external game artwork"
          git push origin HEAD:jurisquest-commercial-20260916
