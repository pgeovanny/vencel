name: JurisQuest Security Audit

on:
  push:
    branches: [jurisquest-commercial-20260916]
  workflow_dispatch:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('npm-audit.json','utf8'));
          const v=a.metadata?.vulnerabilities||{};
          console.log('AUDIT_COUNTS',JSON.stringify(v));
          for(const [name,item] of Object.entries(a.vulnerabilities||{})){
            console.log('AUDIT_ITEM',JSON.stringify({name,severity:item.severity,isDirect:item.isDirect,via:item.via,effects:item.effects,range:item.range,fixAvailable:item.fixAvailable}));
          }
          if((v.critical||0)>0||(v.high||0)>0)process.exitCode=1;
          NODE
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jurisquest-npm-audit-${{ github.run_id }}
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7
