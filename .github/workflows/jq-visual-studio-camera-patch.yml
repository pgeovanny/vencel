name: JurisQuest Visual Studio Camera Patch

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  patch-visual-studio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Add per-scene camera framing control
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/admin/visual-studio.tsx')
          s=p.read_text()
          old='''<div className="sceneControls"><label>Preset<select value={v.preset||''} onChange={e=>updateStage(s.id,{preset:e.target.value})}>{presets.map(p=><option key={p.slug} value={p.slug}>{p.name}</option>)}</select></label><label>Horário<select value={v.time||'auto'} onChange={e=>updateStage(s.id,{time:e.target.value})}>{TIME_OPTIONS.map(x=><option key={x}>{x}</option>)}</select></label><label>Clima<select value={v.weather||'auto'} onChange={e=>updateStage(s.id,{weather:e.target.value})}>{WEATHER_OPTIONS.map(x=><option key={x}>{x}</option>)}</select></label><label>Densidade<select value={v.density||'rich'} onChange={e=>updateStage(s.id,{density:e.target.value})}><option value="clean">clean</option><option value="balanced">balanced</option><option value="rich">rich</option></select></label></div>'''
          new='''<div className="sceneControls"><label>Preset<select value={v.preset||''} onChange={e=>updateStage(s.id,{preset:e.target.value})}>{presets.map(p=><option key={p.slug} value={p.slug}>{p.name}</option>)}</select></label><label>Horário<select value={v.time||'auto'} onChange={e=>updateStage(s.id,{time:e.target.value})}>{TIME_OPTIONS.map(x=><option key={x}>{x}</option>)}</select></label><label>Clima<select value={v.weather||'auto'} onChange={e=>updateStage(s.id,{weather:e.target.value})}>{WEATHER_OPTIONS.map(x=><option key={x}>{x}</option>)}</select></label><label>Densidade<select value={v.density||'rich'} onChange={e=>updateStage(s.id,{density:e.target.value})}><option value="clean">clean</option><option value="balanced">balanced</option><option value="rich">rich</option></select></label><label className="cameraControl">Câmera <span>{Number(v.camera_zoom||1).toFixed(2)}×</span><input type="range" min="0.94" max="1.06" step="0.01" value={Number(v.camera_zoom||1)} onChange={e=>updateStage(s.id,{camera_zoom:Number(e.target.value)})}/></label></div>'''
          assert old in s
          s=s.replace(old,new,1)
          old=".sceneControls{display:grid;grid-template-columns:1.5fr .7fr .7fr .8fr;gap:8px;padding:13px 14px}"
          new=".sceneControls{display:grid;grid-template-columns:1.45fr .72fr .72fr .82fr 1fr;gap:8px;padding:13px 14px}.cameraControl{position:relative}.cameraControl span{float:right;color:#e2c364;font:850 8px ui-monospace}.cameraControl input{width:100%;margin-top:12px;accent-color:#d8b654}"
          assert old in s
          s=s.replace(old,new,1)
          old="stage.visual = { preset, time, weather, density }"
          new="stage.visual = { preset, time, weather, density, camera_zoom }"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/admin/visual-studio.tsx
          git commit -m "feat: expose per-scene camera framing in Visual Studio"
          git push origin HEAD:jurisquest-commercial-20260916
