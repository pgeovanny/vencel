name: JurisQuest Shared Product Navigation Patch

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  patch-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Apply shared product shell
        run: python scripts/apply_shared_navigation.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css app/profile/page.tsx app/review/page.tsx app/archive/page.tsx app/syllabus/'[id]'/page.tsx
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "refactor: unify product navigation across student surfaces"
            git push origin HEAD:jurisquest-commercial-20260916
          fi
