name: JurisQuest Syllabus Grid Fix
on:
  push:
    branches: [jurisquest-commercial-20260916]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - run: python scripts/fix_syllabus_odd_grid.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/syllabus/[id]/page.tsx'
          git commit -m "fix: make odd syllabus topic grid intentional"
          git push origin HEAD:jurisquest-commercial-20260916
