name: JurisQuest Runtime Visual Contract Patch

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  patch-runtime-visuals:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Connect Visual Studio contract to runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('components/game-runtime-pro-v4.tsx')
          s=p.read_text()
          old="import { STUDIO_CSS } from '@/lib/game/studio-css';"
          new=old+"\nimport { resolveVisualConfig } from '@/lib/game/visual-contract';"
          assert old in s and "resolveVisualConfig" not in s
          s=s.replace(old,new,1)

          old="  runtimeSettings?:any;\n  replayMode?:boolean;"
          new="  runtimeSettings?:any;\n  visualPresets?:any[];\n  replayMode?:boolean;"
          assert old in s
          s=s.replace(old,new,1)

          old="export default function GameRuntimeProV4({missionId,mission,userId,initialCharacter,initialProgress,runtimeSettings,replayMode=false,exploreMode=false,exploreStage=null,mode='campaign',patrolContext=null}:Props){"
          new="export default function GameRuntimeProV4({missionId,mission,userId,initialCharacter,initialProgress,runtimeSettings,visualPresets=[],replayMode=false,exploreMode=false,exploreStage=null,mode='campaign',patrolContext=null}:Props){"
          assert old in s
          s=s.replace(old,new,1)

          old="    player:any;actors:Record<string,any>={};objects:Record<string,any>={};keys:any;cursors:any;worldW=DW;worldH=DH;isDesktop=true;beacon:any;guide:any;targetBadge:any;lastNear='';lastDistance=-1;rain:any[]=[];autoTarget:any=null;autoOpenLock=false;"
          new="    player:any;actors:Record<string,any>={};objects:Record<string,any>={};keys:any;cursors:any;worldW=DW;worldH=DH;isDesktop=true;beacon:any;guide:any;targetBadge:any;lastNear='';lastDistance=-1;rain:any[]=[];dust:any[]=[];autoTarget:any=null;autoOpenLock=false;"
          assert old in s
          s=s.replace(old,new,1)

          old="    configure(){this.isDesktop=this.scale.width>=900;this.worldW=this.isDesktop?this.scale.width:DW;this.worldH=this.isDesktop?this.scale.height:DH;this.physics.world.setBounds(0,0,this.worldW,this.worldH);this.cameras.main.setBounds(0,0,this.worldW,this.worldH);this.cameras.main.setZoom(this.isDesktop?1:Number(runtimeSettings?.settings?.camera_zoom_mobile||.86));if(this.isDesktop){this.cameras.main.stopFollow();this.cameras.main.setScroll(0,0)}}"
          new="    visual(s:any){return resolveVisualConfig(s,mission,visualPresets,runtimeSettings||undefined)}\n    configure(s:any){this.isDesktop=this.scale.width>=900;this.worldW=this.isDesktop?this.scale.width:DW;this.worldH=this.isDesktop?this.scale.height:DH;this.physics.world.setBounds(0,0,this.worldW,this.worldH);this.cameras.main.setBounds(0,0,this.worldW,this.worldH);const v=this.visual(s),desktopZoom=Math.max(.94,Math.min(1.06,Number(v?.camera_zoom||1)));this.cameras.main.setZoom(this.isDesktop?desktopZoom:Number(runtimeSettings?.settings?.camera_zoom_mobile||.86));if(this.isDesktop){this.cameras.main.stopFollow();this.cameras.main.setScroll(0,0)}}"
          assert old in s
          s=s.replace(old,new,1)

          old="    ambient(s:any){if(s.environment==='parking_night'){for(const x of [180,520,1080,1430]){const light=this.add.circle(x/1600*this.worldW,155/900*this.worldH,Math.max(75,this.worldH*.11),0xffd77d,.045).setDepth(-70);light.setBlendMode(P.BlendModes.ADD)}for(let i=0;i<34;i++){const line=this.add.rectangle(Math.random()*this.worldW,Math.random()*this.worldH,1,14,0xb7ecff,.12).setRotation(-.16).setDepth(40);this.rain.push(line)}}else{const tint=this.add.rectangle(this.worldW/2,this.worldH/2,this.worldW,this.worldH,s.environment==='courtroom'?0xffe1ad:0xc7eff0,.02).setDepth(-70);tint.setBlendMode(P.BlendModes.ADD)}}"
          new="""    ambient(s:any){const v=this.visual(s),quality=this.isDesktop?(runtimeSettings?.renderer_quality||'high'):(runtimeSettings?.mobile_quality||'balanced'),rich=v?.density==='rich',low=quality==='low';const time=v?.time||'day',weather=v?.weather||'clear',particles=v?.particles||'none',fog=Math.max(0,Math.min(.35,Number(v?.fog||0))),vignette=Math.max(0,Math.min(.4,Number(v?.vignette||0)));let tint=0x88dbe8,alpha=.018;if(time==='night'){tint=0x1d5d78;alpha=.095}else if(time==='sunset'){tint=0xf0a050;alpha=.105}else if(time==='day'){tint=0xd9f2ef;alpha=.035}else if(time==='indoor'){tint=s.environment==='courtroom'?0xffdfaa:0xbceff0;alpha=.028}const wash=this.add.rectangle(this.worldW/2,this.worldH/2,this.worldW,this.worldH,tint,alpha).setDepth(-78);wash.setBlendMode(time==='night'?P.BlendModes.MULTIPLY:P.BlendModes.ADD);if(s.environment==='parking_night'||time==='night'){for(const x of [180,520,1080,1430]){const light=this.add.circle(x/1600*this.worldW,155/900*this.worldH,Math.max(75,this.worldH*.11),0xffd77d,rich?.055:.038).setDepth(-70);light.setBlendMode(P.BlendModes.ADD)}}if(fog>0&&!low){const n=rich?5:3;for(let i=0;i<n;i++){const f=this.add.ellipse((i+.35)/n*this.worldW,this.worldH*(.28+(i%2)*.22),this.worldW*.42,this.worldH*.28,0xc5edf2,fog*.16).setDepth(35);f.setBlendMode(P.BlendModes.SCREEN);this.tweens.add({targets:f,x:f.x+(i%2?70:-70),alpha:{from:f.alpha*.7,to:f.alpha},duration:6500+i*900,yoyo:true,repeat:-1,ease:'Sine.easeInOut'})}}const rainOn=weather==='rain'||particles==='rain';if(rainOn&&!low){const count=rich?56:quality==='high'?42:28;for(let i=0;i<count;i++){const line=this.add.rectangle(Math.random()*this.worldW,Math.random()*this.worldH,1,12+Math.random()*11,0xb7ecff,.10+Math.random()*.08).setRotation(-.16).setDepth(40);this.rain.push(line)}}const dustOn=particles==='dust'&&weather!=='rain';if(dustOn&&!low){const count=rich?20:12;for(let i=0;i<count;i++){const d=this.add.circle(Math.random()*this.worldW,Math.random()*this.worldH,1+Math.random()*1.6,0xffe4aa,.08+Math.random()*.10).setDepth(34);this.dust.push(d);this.tweens.add({targets:d,y:d.y-24-Math.random()*42,x:d.x-12+Math.random()*24,alpha:{from:d.alpha*.35,to:d.alpha},duration:4200+Math.random()*4200,yoyo:true,repeat:-1,ease:'Sine.easeInOut'})}}if(weather==='overcast'){this.add.rectangle(this.worldW/2,this.worldH/2,this.worldW,this.worldH,0x8aa1a7,.07).setDepth(30).setBlendMode(P.BlendModes.MULTIPLY)}if(vignette>0){const a=vignette*.33,th=Math.max(55,this.worldH*.11);this.add.rectangle(this.worldW/2,th/2,this.worldW,th,0x000000,a).setDepth(1500);this.add.rectangle(this.worldW/2,this.worldH-th/2,this.worldW,th,0x000000,a).setDepth(1500);this.add.rectangle(th/2,this.worldH/2,th,this.worldH,0x000000,a*.65).setDepth(1500);this.add.rectangle(this.worldW-th/2,this.worldH/2,th,this.worldH,0x000000,a*.65).setDepth(1500)}}"""
          assert old in s
          s=s.replace(old,new,1)

          old="    buildStage(s:any){if(!s)return;this.children.removeAll(true);this.rain=[];this.actors={};this.objects={};this.lastNear='';this.autoTarget=null;setNear(null);setDistance(null);this.configure();"
          new="    buildStage(s:any){if(!s)return;this.children.removeAll(true);this.rain=[];this.dust=[];this.actors={};this.objects={};this.lastNear='';this.autoTarget=null;setNear(null);setDistance(null);this.configure(s);"
          assert old in s
          s=s.replace(old,new,1)

          old="      if(!this.player)return;for(const r of this.rain){r.y+=3.4;if(r.y>this.worldH){r.y=-20;r.x=Math.random()*this.worldW}}"
          new="      if(!this.player)return;for(const r of this.rain){r.y+=3.4;if(r.y>this.worldH){r.y=-20;r.x=Math.random()*this.worldW}}for(const d of this.dust){if(d.y<-10)d.y=this.worldH+10}"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          for fname in ['app/game/[id]/page.tsx','app/plantao/page.tsx']:
            p=Path(fname);s=p.read_text()
            if fname.startswith('app/game'):
              old="  const [{ data: character }, { data: progress }, { data: runtimeSettings }] = await Promise.all(["
              new="  const [{ data: character }, { data: progress }, { data: runtimeSettings }, { data: visualPresets }] = await Promise.all(["
              assert old in s;s=s.replace(old,new,1)
              old="    sb.from('game_runtime_settings').select('*').eq('id', 1).maybeSingle(),\n  ]);"
              new="    sb.from('game_runtime_settings').select('*').eq('id', 1).maybeSingle(),\n    sb.from('game_visual_presets').select('slug,name,config').eq('active',true).order('sort_order'),\n  ]);"
              assert old in s;s=s.replace(old,new,1)
              old="      runtimeSettings={runtimeSettings || null}\n      replayMode={replayMode}"
              new="      runtimeSettings={runtimeSettings || null}\n      visualPresets={visualPresets || []}\n      replayMode={replayMode}"
              assert old in s;s=s.replace(old,new,1)
            else:
              old="  const[{data:character},{data:syllabus},{data:runtimeSettings}]=await Promise.all(["
              new="  const[{data:character},{data:syllabus},{data:runtimeSettings},{data:visualPresets}]=await Promise.all(["
              assert old in s;s=s.replace(old,new,1)
              old="    sb.from('game_runtime_settings').select('*').eq('id',1).maybeSingle(),\n  ]);"
              new="    sb.from('game_runtime_settings').select('*').eq('id',1).maybeSingle(),\n    sb.from('game_visual_presets').select('slug,name,config').eq('active',true).order('sort_order'),\n  ]);"
              assert old in s;s=s.replace(old,new,1)
              old="      runtimeSettings={runtimeSettings||null}\n      patrolContext="
              new="      runtimeSettings={runtimeSettings||null}\n      visualPresets={visualPresets||[]}\n      patrolContext="
              assert old in s;s=s.replace(old,new,1)
            p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game-runtime-pro-v4.tsx app/game/'[id]'/page.tsx app/plantao/page.tsx
          git commit -m "feat: apply admin visual presets in unified runtime"
          git push origin HEAD:jurisquest-commercial-20260916
