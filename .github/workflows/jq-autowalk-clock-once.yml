name: JurisQuest deterministic auto walk
on:
  push:
    branches: [jurisquest-commercial-20260916]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - run: python scripts/fix_time_based_autowalk.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game-runtime-pro-v4.tsx qa/user-flow.spec.mjs
          git commit -m "fix: make automatic walk time-based"
          git push origin HEAD:jurisquest-commercial-20260916
