name: JurisQuest Admin Copy Polish

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Apply admin copy polish
        run: python scripts/polish_admin_copy.py
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx app/dashboard/page.tsx components/patrol-mode-v4.tsx
          git commit -m "fix: make admin and product copy commercial"
          git push origin HEAD:jurisquest-commercial-20260916
