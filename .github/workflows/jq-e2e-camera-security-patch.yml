name: JurisQuest E2E Camera Security Patch

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  patch-e2e:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Apply E2E patch
        run: python scripts/patch_e2e_camera_and_security.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/user-flow.spec.mjs
          git commit -m "qa: make student journey camera-aware and answer-key blind"
          git push origin HEAD:jurisquest-commercial-20260916
