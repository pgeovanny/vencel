name: JurisQuest Plantao Copy Polish

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Apply Plantao copy polish
        run: python scripts/polish_patrol_copy.py
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/patrol-mode-v4.tsx components/game-runtime-pro-v4.tsx
          git commit -m "fix: remove technical copy from student experience"
          git push origin HEAD:jurisquest-commercial-20260916
