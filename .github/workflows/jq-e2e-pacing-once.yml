name: JurisQuest E2E Pacing Gate Fix
on:
  push:
    branches: [jurisquest-commercial-20260916]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - run: python scripts/fix_e2e_pacing_gate.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/user-flow.spec.mjs
          git commit -m "test: make E2E functional under throttled graphics"
          git push origin HEAD:jurisquest-commercial-20260916
