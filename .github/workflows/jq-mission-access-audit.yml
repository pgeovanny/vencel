name: JurisQuest Mission Access Audit

on:
  push:
    branches: [jurisquest-commercial-20260916]

permissions:
  contents: write

jobs:
  mission-access-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jurisquest-commercial-20260916
          fetch-depth: 0
      - name: Generate access inventory
        run: python scripts/audit_mission_access.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mission-access-audit.txt
          git commit -m "docs: inventory mission data access"
          git push origin HEAD:jurisquest-commercial-20260916
